<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cifra11</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1e1e1e;
    padding: 30px 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 15px;
  }
  .abas {
    display: flex;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #333;
  }
  .aba {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    background: #2a2a2a;
    color: #aaa;
    font-size: 14px;
  }
  .aba.ativa {
    background: #4caf50;
    color: #fff;
    font-weight: bold;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #ccc;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #2a2a2a;
    color: #fff;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .msg {
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
  .erro { color: #ff6b6b; }
  .sucesso { color: #6bffa1; }
  .oculto { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>🎸 Cifra11</h1>

  <div class="abas">
    <div class="aba ativa" id="abaLogin">Entrar</div>
    <div class="aba" id="abaCadastro">Criar conta</div>
  </div>

  <!-- FORM DE LOGIN -->
  <form id="formLogin">
    <label for="usuario">Usuário ou e-mail</label>
    <input type="text" id="usuario" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>

    <button type="submit" id="btnEntrar">Entrar</button>
  </form>

  <!-- FORM DE CADASTRO -->
  <form id="formCadastro" class="oculto">
    <label for="nomeCadastro">Seu nome</label>
    <input type="text" id="nomeCadastro" required>

    <label for="usuarioCadastro">Nome de usuário (sem espaços)</label>
    <input type="text" id="usuarioCadastro" required>

    <label for="senhaCadastro">Senha</label>
    <input type="password" id="senhaCadastro" required>

    <label for="senhaCadastro2">Confirmar senha</label>
    <input type="password" id="senhaCadastro2" required>

    <button type="submit" id="btnCadastrar">Criar conta</button>
  </form>

  <div class="msg erro" id="msgErro"></div>
  <div class="msg sucesso" id="msgSucesso"></div>
</div>

<script>
  // Se já estiver logado, vai direto pra home
  (async () => {
    const { data } = await sbClient.auth.getSession();
    if (data.session) {
      window.location.href = "index.html";
    }
  })();

  const abaLogin = document.getElementById("abaLogin");
  const abaCadastro = document.getElementById("abaCadastro");
  const formLogin = document.getElementById("formLogin");
  const formCadastro = document.getElementById("formCadastro");
  const msgErro = document.getElementById("msgErro");
  const msgSucesso = document.getElementById("msgSucesso");

  function limparMsgs() {
    msgErro.style.display = "none";
    msgSucesso.style.display = "none";
  }

  abaLogin.addEventListener("click", () => {
    abaLogin.classList.add("ativa");
    abaCadastro.classList.remove("ativa");
    formLogin.classList.remove("oculto");
    formCadastro.classList.add("oculto");
    limparMsgs();
  });

  abaCadastro.addEventListener("click", () => {
    abaCadastro.classList.add("ativa");
    abaLogin.classList.remove("ativa");
    formCadastro.classList.remove("oculto");
    formLogin.classList.add("oculto");
    limparMsgs();
  });

  // LOGIN
  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    limparMsgs();

    let usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;

    let email = usuario.includes("@") ? usuario : usuario + "@bandacifras.local";

    const btn = document.getElementById("btnEntrar");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const { error } = await sbClient.auth.signInWithPassword({ email, password: senha });

    if (error) {
      msgErro.textContent = "Usuário ou senha inválidos.";
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    window.location.href = "index.html";
  });

  // CADASTRO
  formCadastro.addEventListener("submit", async (e) => {
    e.preventDefault();
    limparMsgs();

    const nome = document.getElementById("nomeCadastro").value.trim();
    const usuario = document.getElementById("usuarioCadastro").value.trim().toLowerCase().replace(/\s+/g, "");
    const senha = document.getElementById("senhaCadastro").value;
    const senha2 = document.getElementById("senhaCadastro2").value;

    if (senha !== senha2) {
      msgErro.textContent = "As senhas não são iguais.";
      msgErro.style.display = "block";
      return;
    }

    if (senha.length < 6) {
      msgErro.textContent = "A senha precisa ter pelo menos 6 caracteres.";
      msgErro.style.display = "block";
      return;
    }

    const email = usuario + "@bandacifras.local";

    const btn = document.getElementById("btnCadastrar");
    btn.disabled = true;
    btn.textContent = "Criando...";

    const { data, error } = await sbClient.auth.signUp({ email, password: senha });

    if (error) {
      msgErro.textContent = error.message.includes("already registered")
        ? "Esse nome de usuário já existe. Escolhe outro."
        : "Erro ao criar conta: " + error.message;
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Criar conta";
      return;
    }

    // Cria o perfil como "membro" por padrão
    const { error: erroPerfil } = await sbClient
      .from("perfis")
      .insert({ id: data.user.id, nome: nome, papel: "membro" });

    if (erroPerfil) {
      msgErro.textContent = "Conta criada, mas houve um erro ao salvar o perfil: " + erroPerfil.message;
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Criar conta";
      return;
    }

    msgSucesso.textContent = "Conta criada! Redirecionando...";
    msgSucesso.style.display = "block";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  });
</script>

</body>
</html>
