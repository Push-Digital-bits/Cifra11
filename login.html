<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G11 Cifras - Login</title>
<link rel="stylesheet" href="estilo.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#05070F">
<style>
  html, body { height: 100%; }
  body {
    padding: 0;
    max-width: none;
    margin: 0;
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .fundo {
    position: fixed;
    inset: 0;
    background-image: url('fundo-login.png');
    background-size: cover;
    background-position: center 20%;
    z-index: 0;
  }
  .fundo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,23,42,0.55) 0%, rgba(15,23,42,0.88) 55%, #0F172A 100%);
  }

  .caixa {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    margin: 40px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 22px;
    padding: 30px 24px 26px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .logoTopo { position: fixed; top: 14px; right: 14px; z-index: 5; margin: 0; }
  .logoTopo img {
    width: 56px;
    height: auto;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5));
  }

  .abas {
    display: flex;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
  }
  .aba {
    flex: 1;
    text-align: center;
    padding: 11px;
    cursor: pointer;
    color: #E5E7EB;
    font-size: 14px;
    font-weight: 600;
  }
  .aba.ativa {
    background: #F97316;
    color: #0F172A;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #E5E7EB;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  input {
    margin-bottom: 16px;
    background: rgba(255,255,255,0.12) !important;
    border: 1px solid rgba(255,255,255,0.3) !important;
    color: #fff !important;
  }
  input::placeholder { color: rgba(255,255,255,0.55); }

  .msg {
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
  .erro { color: #ffb4b4; }
  .sucesso { color: #a8ffcf; }
  .oculto { display: none; }
</style>
</head>

<div class="caixa">

  <div class="abas">
    <div class="aba ativa" id="abaLogin">Entrar</div>
    <div class="aba" id="abaCadastro">Criar conta</div>
  </div>

  <!-- FORM DE LOGIN -->
  <form id="formLogin">
    <label for="usuario">Usuário ou e-mail</label>
    <input type="text" id="usuario" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>

    <button type="submit" id="btnEntrar" style="width:100%;">Entrar</button>
  </form>

  <!-- FORM DE CADASTRO -->
  <form id="formCadastro" class="oculto">
    <label for="nomeCadastro">Seu nome</label>
    <input type="text" id="nomeCadastro" required>

    <label for="usuarioCadastro">Nome de usuário (sem espaços)</label>
    <input type="text" id="usuarioCadastro" required>

    <label for="codigoGrupoCadastro">Código do grupo</label>
    <input type="text" id="codigoGrupoCadastro" inputmode="numeric" maxlength="6" placeholder="Ex: 011519" required>

    <label for="senhaCadastro">Senha</label>
    <input type="password" id="senhaCadastro" required>

    <label for="senhaCadastro2">Confirmar senha</label>
    <input type="password" id="senhaCadastro2" required>

    <button type="submit" id="btnCadastrar" style="width:100%;">Criar conta</button>
  </form>

  <div class="msg erro" id="msgErro"></div>
  <div class="msg sucesso" id="msgSucesso"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
  (async () => {
    const { data } = await sbClient.auth.getSession();
    if (data.session) {
      window.location.href = "index.html";
    }
  })();

  const abaLogin = document.getElementById("abaLogin");
  const abaCadastro = document.getElementById("abaCadastro");
  const formLogin = document.getElementById("formLogin");
  const formCadastro = document.getElementById("formCadastro");
  const msgErro = document.getElementById("msgErro");
  const msgSucesso = document.getElementById("msgSucesso");

  function limparMsgs() {
    msgErro.style.display = "none";
    msgSucesso.style.display = "none";
  }

  abaLogin.addEventListener("click", () => {
    abaLogin.classList.add("ativa");
    abaCadastro.classList.remove("ativa");
    formLogin.classList.remove("oculto");
    formCadastro.classList.add("oculto");
    limparMsgs();
  });

  abaCadastro.addEventListener("click", () => {
    abaCadastro.classList.add("ativa");
    abaLogin.classList.remove("ativa");
    formCadastro.classList.remove("oculto");
    formLogin.classList.add("oculto");
    limparMsgs();
  });

  formLogin.addEventListener("submit", async (e) => {
    e.preventDefault();
    limparMsgs();

    let usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;

    let email = usuario.includes("@") ? usuario : usuario + "@bandacifras.local";

    const btn = document.getElementById("btnEntrar");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const { error } = await sbClient.auth.signInWithPassword({ email, password: senha });

    if (error) {
      msgErro.textContent = "Usuário ou senha inválidos.";
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    window.location.href = "index.html";
  });

  formCadastro.addEventListener("submit", async (e) => {
    e.preventDefault();
    limparMsgs();

    const nome = document.getElementById("nomeCadastro").value.trim();
    const usuario = document.getElementById("usuarioCadastro").value.trim().toLowerCase().replace(/\s+/g, "");
    const codigoGrupo = document.getElementById("codigoGrupoCadastro").value.trim();
    const senha = document.getElementById("senhaCadastro").value;
    const senha2 = document.getElementById("senhaCadastro2").value;

    if (!/^\d{6}$/.test(codigoGrupo)) {
      msgErro.textContent = "O código do grupo tem 6 números.";
      msgErro.style.display = "block";
      return;
    }

    if (senha !== senha2) {
      msgErro.textContent = "As senhas não são iguais.";
      msgErro.style.display = "block";
      return;
    }

    if (senha.length < 6) {
      msgErro.textContent = "A senha precisa ter pelo menos 6 caracteres.";
      msgErro.style.display = "block";
      return;
    }

    const email = usuario + "@bandacifras.local";

    const btn = document.getElementById("btnCadastrar");
    btn.disabled = true;
    btn.textContent = "Criando...";

    const { data, error } = await sbClient.auth.signUp({ email, password: senha });

    if (error) {
      msgErro.textContent = error.message.includes("already registered")
        ? "Esse nome de usuário já existe. Escolhe outro."
        : "Erro ao criar conta: " + error.message;
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Criar conta";
      return;
    }

    const { data: perfilCriado, error: erroPerfil } = await sbClient.rpc("entrar_em_grupo", {
      p_codigo: codigoGrupo,
      p_nome: nome
    });

    if (erroPerfil) {
      const msg = erroPerfil.message.includes("codigo_invalido")
        ? "Código do grupo inválido. Confere com o administrador do seu grupo."
        : erroPerfil.message.includes("ja_e_membro")
        ? "Você já faz parte desse grupo."
        : "Conta criada, mas houve um erro ao entrar no grupo: " + erroPerfil.message;
      msgErro.textContent = msg;
      msgErro.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Criar conta";
      return;
    }

    if (perfilCriado && perfilCriado.status === "pendente") {
      msgSucesso.textContent = "Conta criada! Seu grupo atingiu o limite de membros — você fica pendente até o administrador liberar mais vagas.";
      msgSucesso.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Criar conta";
      return;
    }

    msgSucesso.textContent = "Conta criada! Redirecionando...";
    msgSucesso.style.display = "block";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  });
</script>

</body>
</html>
