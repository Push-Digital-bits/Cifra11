<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifra - G11 Cifras</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body {
    max-width: 700px;
    padding-bottom: 110px;
    --tema-bg: #000000;
    --tema-texto: #F97316;
    --tema-borda: rgba(255,255,255,0.18);
    background: var(--tema-bg);
    transition: background 0.2s ease;
  }
  #topo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--tema-borda);
  }
  #voltar {
    font-size: 20px;
    color: var(--tema-texto);
    background: transparent;
    border: 1px solid var(--tema-borda);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-decoration: none;
  }
  #titulo {
    font-size: 19px;
    font-weight: 700;
    color: var(--tema-texto);
  }
  #conteudo {
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.65;
    background: transparent;
    border: none;
    padding: 8px 2px 40px;
    color: var(--tema-texto);
    min-height: 40px;
  }
  #btnEditarMusica {
    display: none;
    margin: -6px 0 16px;
    width: auto;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--tema-texto);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--tema-borda);
    box-shadow: none;
  }
  #formEditarMusica {
    display: none;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--tema-borda);
    border-radius: 12px;
    padding: 16px;
  }
  #formEditarMusica label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 12px;
    margin-bottom: 5px;
  }
  #formEditarMusica label:first-of-type { margin-top: 0; }
  #formEditarMusica input[type="text"] { background: rgba(0,0,0,0.3); color: var(--tema-texto); }
  #formEditarMusica textarea {
    width: 100%;
    min-height: 260px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #263252;
    background: rgba(0,0,0,0.3);
    color: var(--tema-texto);
    font-family: 'Courier New', monospace;
    font-size: 15px;
    line-height: 1.5;
    box-sizing: border-box;
    resize: vertical;
  }
  #formEditarMusica textarea:focus { outline: none; border-color: var(--tema-texto); }
  .botoesEdicao { display: flex; gap: 10px; margin-top: 16px; }
  .botoesEdicao button { margin: 0; width: auto; padding: 10px 16px; font-size: 14px; }
</style>
</head>
<body>
<div id="topo">
<a id="voltar" href="index.html">←</a>
<span id="titulo">Carregando...</span>
</div>
<button id="btnEditarMusica">✏️ Editar música</button>
<div id="formEditarMusica">
<label for="editTitulo">Título</label>
<input type="text" id="editTitulo">
<label for="editConteudo">Cifra / letra</label>
<textarea id="editConteudo"></textarea>
<div class="botoesEdicao">
<button id="btnSalvarMusica">Salvar</button>
<button id="btnCancelarEdicaoMusica" class="secundario">Cancelar</button>
</div>
</div>
<div id="conteudo"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
<script src="tema.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
let musicaAtual = null;
let ehAdmin = false;

async function carregar() {
if (!id) {
document.getElementById('titulo').textContent = 'Música não especificada';
return;
}
const { data, error } = await sbClient.from('musicas').select('id, titulo, conteudo').eq('id', id).single();
if (error || !data) {
document.getElementById('titulo').textContent = 'Erro ao carregar música';
return;
}
musicaAtual = data;
document.getElementById('titulo').textContent = data.titulo;
document.getElementById('conteudo').textContent = data.conteudo;
}

document.getElementById('btnEditarMusica').addEventListener('click', () => {
if (!musicaAtual) return;
document.getElementById('editTitulo').value = musicaAtual.titulo;
document.getElementById('editConteudo').value = musicaAtual.conteudo;
document.getElementById('conteudo').style.display = 'none';
document.getElementById('formEditarMusica').style.display = 'block';
});

document.getElementById('btnCancelarEdicaoMusica').addEventListener('click', () => {
document.getElementById('formEditarMusica').style.display = 'none';
document.getElementById('conteudo').style.display = 'block';
});

document.getElementById('btnSalvarMusica').addEventListener('click', async () => {
const novoTitulo = document.getElementById('editTitulo').value.trim();
const novoConteudo = document.getElementById('editConteudo').value;
if (!novoTitulo) {
alert('Preenche o título.');
return;
}

const { error } = await sbClient.from('musicas').update({ titulo: novoTitulo, conteudo: novoConteudo }).eq('id', id);
if (error) {
alert('Erro ao salvar: ' + error.message);
console.error(error);
return;
}

musicaAtual.titulo = novoTitulo;
musicaAtual.conteudo = novoConteudo;
document.getElementById('titulo').textContent = novoTitulo;
document.getElementById('conteudo').textContent = novoConteudo;
document.getElementById('formEditarMusica').style.display = 'none';
document.getElementById('conteudo').style.display = 'block';
});

async function iniciar() {
const sessao = await protegerPagina();
if (!sessao) return;

const perfil = await obterPerfil();
ehAdmin = !!(perfil && perfil.papel === 'administrador');
if (ehAdmin) {
document.getElementById('btnEditarMusica').style.display = 'inline-block';
}

iniciarSeletorTema(document.body);
carregar();
}

iniciar();
</script>
</body>
</html>
