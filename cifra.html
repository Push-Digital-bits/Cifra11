<style>

    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--tema-borda);
  }
  #voltar {
    font-size: 20px;
    color: var(--tema-texto);
    background: transparent;
    border: 1px solid var(--tema-borda);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-decoration: none;
  }

    font-size: 19px;
    font-weight: 700;
    color: var(--tema-texto);
  }

    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;

  #areaLapis {

    gap: 10px;

  }
  .grupoBotaoMenu {

  }
  #btnEditarMusica, #btnFerramentas {
    display: none;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    font-size: 17px;
    color: var(--tema-texto);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--tema-borda);
    box-shadow: none;
    align-items: center;
    justify-content: center;
  }
  .menuFlutuante {
    display: none;
    position: absolute;
    top: 46px;
    left: 0;
    z-index: 20;
    background: #16213A;
    border: 1px solid #2A3A5C;
    border-radius: 12px;
    padding: 6px;
    min-width: 190px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .menuFlutuante.aberto { display: block; }
  .menuFlutuante button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin: 0;
    padding: 10px 12px;
    font-size: 14px;
    text-align: left;
    color: #E5E7EB;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .menuFlutuante button:hover { background: rgba(255,255,255,0.08); }
  .menuFlutuante button:disabled { color: #64748B; cursor: not-allowed; }
  #formEditarMusica {
    display: none;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--tema-borda);
    border-radius: 12px;
    padding: 16px;
  }
  #formEditarMusica label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 12px;
    margin-bottom: 5px;

  #formEditarMusica label:first-of-type { margin-top: 0; }
  #formEditarMusica input[type="text"], #formEditarMusica input[type="url"] { background: rgba(0,0,0,0.3); color: var(--tema-texto); }
  #formEditarMusica textarea {
    width: 100%;

    padding: 12px;
    border-radius: 12px;
    border: 1px solid #263252;
    background: rgba(0,0,0,0.3);
    color: var(--tema-texto);
    font-family: 'Courier New', monospace;
    font-size: 15px;
    line-height: 1.5;
    box-sizing: border-box;

  }
  #formEditarMusica textarea:focus { outline: none; border-color: var(--tema-texto); }
  .botoesEdicao { display: flex; gap: 10px; margin-top: 16px; }
  .botoesEdicao button { margin: 0; width: auto; padding: 10px 16px; font-size: 14px; }

    height: 30px;
    padding: 0;

<div id="formEditarMusica">

<input type="url" id="editReferencia" placeholder="https://www.youtube.com/watch?v=...">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
let musicaAtual = null;
let ehAdmin = false;

async function carregar() {
if (!id) {
document.getElementById('titulo').textContent = 'Música não especificada';
return;
}

try {
const { data, error } = await sbClient.from('musicas').select('id, titulo, conteudo, referencia').eq('id', id).single();
if (error || !data) throw error || new Error('não encontrada');

musicaAtual = data;
salvarCacheOffline('musica_' + id, data);
document.getElementById('titulo').textContent = data.titulo;
document.getElementById('conteudo').textContent = data.conteudo;
esconderAvisoOffline();
} catch (e) {
const cache = lerCacheOffline('musica_' + id);
if (cache) {
musicaAtual = cache;
document.getElementById('titulo').textContent = cache.titulo;
document.getElementById('conteudo').textContent = cache.conteudo;
mostrarAvisoOffline('🔌 Sem internet — mostrando versão salva');
} else {
document.getElementById('titulo').textContent = 'Sem internet e sem versão salva desta música';
}
}
}

document.getElementById('btnEditarMusica').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuFerramentas').classList.remove('aberto');
document.getElementById('menuLapis').classList.toggle('aberto');
});

document.getElementById('btnFerramentas').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuLapis').classList.remove('aberto');
document.getElementById('menuFerramentas').classList.toggle('aberto');
});

document.getElementById('btnModoGhost').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuLapis').classList.remove('aberto');
alert('Modo Ghost — em breve 👻');
});

function abrirFormEditarCifra() {
if (!ehAdmin || !musicaAtual) return;
fecharTodosPainelFerramenta();
document.getElementById('editTitulo').value = musicaAtual.titulo;
document.getElementById('editConteudo').value = musicaAtual.conteudo;
document.getElementById('editReferencia').value = musicaAtual.referencia || '';
document.getElementById('conteudo').style.display = 'none';
document.getElementById('formEditarMusica').style.display = 'block';
}

document.getElementById('btnAbrirEditarCifra').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuLapis').classList.remove('aberto');
abrirFormEditarCifra();
});

document.getElementById('btnAbrirEditarTema').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuLapis').classList.remove('aberto');
document.getElementById('painelTema').classList.add('aberto');
});

// pointerdown (em vez de click) fecha o menu de forma confiável em qualquer
// toque fora dele — em alguns navegadores (principalmente iOS/Safari), um toque
// em elementos sem onclick próprio (como o texto da cifra) não dispara "click"
// no elemento pai, e o menu podia ficar preso aberto.
document.addEventListener('pointerdown', (e) => {
const area = document.getElementById('areaLapis');
if (area && !area.contains(e.target)) {
document.getElementById('menuLapis').classList.remove('aberto');
document.getElementById('menuFerramentas').classList.remove('aberto');
}
});

document.getElementById('btnCancelarEdicaoMusica').addEventListener('click', () => {
document.getElementById('formEditarMusica').style.display = 'none';
document.getElementById('conteudo').style.display = 'block';
});

document.getElementById('btnSalvarMusica').addEventListener('click', async () => {
const novoTitulo = document.getElementById('editTitulo').value.trim();
const novoConteudo = document.getElementById('editConteudo').value;
const novaReferencia = document.getElementById('editReferencia').value.trim();
if (!novoTitulo) {
alert('Preenche o título.');
return;
}

const { error } = await sbClient.from('musicas').update({ titulo: novoTitulo, conteudo: novoConteudo, referencia: novaReferencia || null }).eq('id', id);
if (error) {
alert('Erro ao salvar: ' + error.message);
console.error(error);
return;
}

musicaAtual.titulo = novoTitulo;
musicaAtual.conteudo = novoConteudo;
musicaAtual.referencia = novaReferencia || null;
document.getElementById('titulo').textContent = novoTitulo;
document.getElementById('conteudo').textContent = novoConteudo;
document.getElementById('formEditarMusica').style.display = 'none';
document.getElementById('conteudo').style.display = 'block';
});

// ---------- Ferramentas: menu, painéis ----------

document.getElementById('btnAbrirMetronomo').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuFerramentas').classList.remove('aberto');
abrirPainelFerramenta('painelMetronomo');
});

document.getElementById('btnAbrirAfinador').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuFerramentas').classList.remove('aberto');
abrirPainelFerramenta('painelAfinador');
});

document.getElementById('btnAbrirAcompanhamento').addEventListener('click', (e) => {
e.stopPropagation();
document.getElementById('menuFerramentas').classList.remove('aberto');
abrirPainelFerramenta('painelAcompanhamento');
prepararAcompanhamento();
});

document.querySelectorAll('.fecharPainelFerramenta').forEach(botao => {
botao.addEventListener('click', () => {
fecharTodosPainelFerramenta();
});
});

function fecharTodosPainelFerramenta() {
document.querySelectorAll('.painelFerramenta').forEach(p => p.classList.remove('aberto'));
pararMetronomo();
pararAfinador();
document.getElementById('iframeAcompanhamento').src = '';
}

function abrirPainelFerramenta(idPainel) {
fecharTodosPainelFerramenta();
document.getElementById(idPainel).classList.add('aberto');
}

document.getElementById('btnIrEditarReferencia').addEventListener('click', (e) => {
e.stopPropagation();
abrirFormEditarCifra();
});

// ---------- Acompanhamento (vídeo do YouTube) ----------

function extrairIdYoutube(url) {
if (!url) return null;
const padroes = [
/(?:youtube\.com\/watch\?v=)([\w-]{11})/,
/(?:youtu\.be\/)([\w-]{11})/,
/(?:youtube\.com\/shorts\/)([\w-]{11})/,
/(?:youtube\.com\/embed\/)([\w-]{11})/
];
for (const padrao of padroes) {
const m = url.match(padrao);
if (m) return m[1];
}
return null;
}

function prepararAcompanhamento() {
const aviso = document.getElementById('semReferenciaAviso');
const container = document.getElementById('videoAcompanhamentoContainer');
const botaoIr = document.getElementById('btnIrEditarReferencia');
const link = musicaAtual && musicaAtual.referencia;
const idVideo = extrairIdYoutube(link);
botaoIr.style.display = ehAdmin ? 'block' : 'none';
if (!idVideo) {
aviso.style.display = 'block';
container.style.display = 'none';
document.getElementById('iframeAcompanhamento').src = '';
} else {
aviso.style.display = 'none';
container.style.display = 'block';
document.getElementById('iframeAcompanhamento').src = `https://www.youtube.com/embed/${idVideo}?autoplay=1`;
}
}

// ---------- Metrônomo ----------

let metronomoAudioCtx = null;
let metronomoTocando = false;
let metronomoTimerId = null;
let metronomoBpm = 100;
let metronomoSom = 'clique';

function obterAudioCtxMetronomo() {
if (!metronomoAudioCtx) metronomoAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
return metronomoAudioCtx;
}

function tocarSomMetronomo() {
const ctx = obterAudioCtxMetronomo();
const agora = ctx.currentTime;
if (metronomoSom === 'clique') {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.frequency.value = 1000;
osc.type = 'square';
gain.gain.setValueAtTime(0.35, agora);
gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.05);
osc.connect(gain).connect(ctx.destination);
osc.start(agora);
osc.stop(agora + 0.05);
} else if (metronomoSom === 'palma') {
const tamanhoBuffer = Math.floor(ctx.sampleRate * 0.15);
const buffer = ctx.createBuffer(1, tamanhoBuffer, ctx.sampleRate);
const dados = buffer.getChannelData(0);
for (let i = 0; i < tamanhoBuffer; i++) dados[i] = (Math.random() * 2 - 1) * Math.exp(-i / (tamanhoBuffer * 0.25));
const fonte = ctx.createBufferSource();
fonte.buffer = buffer;
const filtro = ctx.createBiquadFilter();
filtro.type = 'bandpass';
filtro.frequency.value = 1500;
filtro.Q.value = 0.8;
const gain = ctx.createGain();
gain.gain.setValueAtTime(0.9, agora);
fonte.connect(filtro).connect(gain).connect(ctx.destination);
fonte.start(agora);
} else {
const osc1 = ctx.createOscillator();
const osc2 = ctx.createOscillator();
const gain = ctx.createGain();
osc1.type = 'square'; osc1.frequency.value = 800;
osc2.type = 'square'; osc2.frequency.value = 540;
gain.gain.setValueAtTime(0.25, agora);
gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.3);
osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
osc1.start(agora); osc2.start(agora);
osc1.stop(agora + 0.3); osc2.stop(agora + 0.3);
}
}

function agendarProximoBeat() {
tocarSomMetronomo();
metronomoTimerId = setTimeout(agendarProximoBeat, 60000 / metronomoBpm);
}

function iniciarMetronomo() {
if (metronomoTocando) return;
metronomoTocando = true;
agendarProximoBeat();
document.getElementById('btnMetronomoIniciar').textContent = '⏸️ Parar';
}

function pararMetronomo() {
if (!metronomoTocando) return;
metronomoTocando = false;
clearTimeout(metronomoTimerId);
document.getElementById('btnMetronomoIniciar').textContent = '▶️ Iniciar';
}

document.querySelectorAll('.opcaoSom').forEach(botao => {
botao.addEventListener('click', () => {
document.querySelectorAll('.opcaoSom').forEach(b => b.classList.remove('ativo'));
botao.classList.add('ativo');
metronomoSom = botao.getAttribute('data-som');
});
});

function ajustarBpm(delta) {
metronomoBpm = Math.max(40, Math.min(240, metronomoBpm + delta));
document.getElementById('valorBpmNum').textContent = metronomoBpm;
if (metronomoTocando) {
clearTimeout(metronomoTimerId);
agendarProximoBeat();
}
}

document.getElementById('btnBpmMenos').addEventListener('click', () => ajustarBpm(-1));
document.getElementById('btnBpmMais').addEventListener('click', () => ajustarBpm(1));

document.getElementById('btnMetronomoIniciar').addEventListener('click', () => {
if (metronomoTocando) pararMetronomo(); else iniciarMetronomo();
});

// ---------- Afinador ----------

let afinadorAudioCtx = null;
let afinadorStream = null;
let afinadorAnalyser = null;
let afinadorRodando = false;
let afinadorRaf = null;

const NOTAS_AFINADOR = ['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];

function freqParaNota(freq) {
const midi = 69 + 12 * Math.log2(freq / 440);
const midiArred = Math.round(midi);
const cents = Math.round((midi - midiArred) * 100);
const nomeNota = NOTAS_AFINADOR[((midiArred % 12) + 12) % 12];
const oitava = Math.floor(midiArred / 12) - 1;
return { nome: nomeNota, oitava, cents };
}

function autocorrelacaoAfinador(buffer, sampleRate) {
const tamanho = buffer.length;
let rms = 0;
for (let i = 0; i < tamanho; i++) rms += buffer[i] * buffer[i];
rms = Math.sqrt(rms / tamanho);
if (rms < 0.01) return -1;
let melhorOffset = -1;
let melhorCorrelacao = 0;
let ultimaCorrelacao = 1;
for (let offset = 40; offset < 1000; offset++) {
let correlacao = 0;
for (let i = 0; i < tamanho - offset; i++) {
correlacao += Math.abs(buffer[i] - buffer[i + offset]);
}
correlacao = 1 - (correlacao / (tamanho - offset));
if (correlacao > 0.9 && correlacao > ultimaCorrelacao) {
melhorCorrelacao = correlacao;
melhorOffset = offset;
}
ultimaCorrelacao = correlacao;
}
if (melhorCorrelacao > 0.01 && melhorOffset !== -1) {
return sampleRate / melhorOffset;
}
return -1;
}

function loopAfinador() {
if (!afinadorRodando) return;
const buffer = new Float32Array(afinadorAnalyser.fftSize);
afinadorAnalyser.getFloatTimeDomainData(buffer);
const freq = autocorrelacaoAfinador(buffer, afinadorAudioCtx.sampleRate);
if (freq !== -1 && freq > 50 && freq < 1200) {
const { nome, oitava, cents } = freqParaNota(freq);
document.getElementById('notaAfinador').textContent = nome + oitava;
document.getElementById('centsAfinador').textContent = (cents > 0 ? '+' : '') + cents + ' cents';
const ponteiro = document.getElementById('ponteiroAfinador');
const posicao = Math.max(-50, Math.min(50, cents));
ponteiro.style.left = (50 + posicao) + '%';
document.querySelector('.barraAfinador').classList.toggle('afinado', Math.abs(cents) <= 5);
} else {
document.getElementById('notaAfinador').textContent = '—';
document.getElementById('centsAfinador').textContent = '';
document.querySelector('.barraAfinador').classList.remove('afinado');
}
afinadorRaf = requestAnimationFrame(loopAfinador);
}

async function iniciarAfinador() {
if (afinadorRodando) return;
try {
afinadorStream = await navigator.mediaDevices.getUserMedia({ audio: true });
} catch (e) {
alert('Não consegui acessar o microfone.');
return;
}
afinadorAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
const fonte = afinadorAudioCtx.createMediaStreamSource(afinadorStream);
afinadorAnalyser = afinadorAudioCtx.createAnalyser();
afinadorAnalyser.fftSize = 2048;
fonte.connect(afinadorAnalyser);
afinadorRodando = true;
document.getElementById('btnAfinadorIniciar').textContent = '⏹️ Parar';
loopAfinador();
}

function pararAfinador() {
if (!afinadorRodando) return;
afinadorRodando = false;
if (afinadorRaf) cancelAnimationFrame(afinadorRaf);
if (afinadorStream) afinadorStream.getTracks().forEach(t => t.stop());
if (afinadorAudioCtx) afinadorAudioCtx.close();
afinadorAudioCtx = null;
document.getElementById('btnAfinadorIniciar').textContent = '🎤 Iniciar';
document.getElementById('notaAfinador').textContent = '—';
document.getElementById('centsAfinador').textContent = '';
document.querySelector('.barraAfinador').classList.remove('afinado');
}

document.getElementById('btnAfinadorIniciar').addEventListener('click', () => {
if (afinadorRodando) pararAfinador(); else iniciarAfinador();
});

async function iniciar() {
const sessao = await protegerPagina();
if (!sessao) return;

const perfil = await obterPerfil();
ehAdmin = !!(perfil && perfil.papel === 'administrador');
document.getElementById('btnEditarMusica').style.display = 'flex';
document.getElementById('btnFerramentas').style.display = 'flex';
document.getElementById('btnAbrirEditarCifra').disabled = !ehAdmin;

iniciarSeletorTema(document.body, { visivelDeInicio: false });
carregar();
}

iniciar();
</script>
