<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifra - G11 Cifras</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body {
    max-width: 700px;
    padding-bottom: 110px;
    --tema-bg: #000000;
    --tema-texto: #F97316;
    --tema-borda: rgba(255,255,255,0.18);
    background: var(--tema-bg);
    transition: background 0.2s ease;
  }
  #topo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--tema-borda);
  }
  #voltar {
    font-size: 20px;
    color: var(--tema-texto);
    background: transparent;
    border: 1px solid var(--tema-borda);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-decoration: none;
  }
  #titulo {
    font-size: 19px;
    font-weight: 700;
    color: var(--tema-texto);
  }
  #conteudo {
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.65;
    background: transparent;
    border: none;
    padding: 8px 2px 40px;
    color: var(--tema-texto);
    min-height: 40px;
  }
</style>
</head>
<body>
<div id="topo">
<a id="voltar" href="index.html">←</a>
<span id="titulo">Carregando...</span>
</div>
<div id="conteudo"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
<script src="tema.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

async function carregar() {
if (!id) {
document.getElementById('titulo').textContent = 'Música não especificada';
return;
}
const { data, error } = await sbClient.from('musicas').select('titulo, conteudo').eq('id', id).single();
if (error || !data) {
document.getElementById('titulo').textContent = 'Erro ao carregar música';
return;
}
document.getElementById('titulo').textContent = data.titulo;
document.getElementById('conteudo').textContent = data.conteudo;
}

async function iniciar() {
const sessao = await protegerPagina();
if (!sessao) return;
iniciarSeletorTema(document.body);
carregar();
}

iniciar();
</script>
</body>
</html>
