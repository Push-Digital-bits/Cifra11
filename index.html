<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cifras da Banda</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 15px; }
    input#busca { width: 100%; padding: 12px; font-size: 18px; box-sizing: border-box; margin-bottom: 10px; }
    #lista a { display: block; padding: 12px 8px; text-decoration: none; color: #222; border-bottom: 1px solid #eee; font-size: 17px; }
    #lista a:active { background: #f0f0f0; }
    #contador { color: #888; font-size: 13px; margin-bottom: 8px; }

    #repertorios { margin-bottom: 20px; }
    .cardRepertorio { display: block; padding: 12px; margin-bottom: 8px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #222; }
    .cardRepertorio .nome { font-weight: bold; font-size: 16px; }
    .cardRepertorio .dias { font-size: 13px; color: #666; }
    #linkNovoRepertorio { display: inline-block; margin-bottom: 15px; font-size: 14px; }

    #cabecalho { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    #cabecalho h1 { font-size: 20px; margin: 0; }
    #boasVindas { font-size: 13px; color: #555; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    #boasVindas a { font-size: 13px; color: #4444cc; text-decoration: none; margin-left: 10px; }
    #linkAdmin { display: inline-block; margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="cabecalho">
    <h1>Cifras da Banda</h1>
  </div>
  <div id="boasVindas"></div>

  <input type="text" id="busca" placeholder="Buscar música...">

  <div id="repertorios"></div>
  <a id="linkNovoRepertorio" href="novo-repertorio.html" style="display:none;">+ Criar novo repertório</a>
  <br>
  <a id="linkAdmin" href="admin.html" style="display:none;">⚙️ Gerenciar usuários</a>

  <div id="contador"></div>
  <div id="lista">Carregando...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script>
    let todasMusicas = [];

    function normalizar(texto) {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function levenshtein(a, b) {
      const custos = [];
      for (let i = 0; i <= a.length; i++) {
        custos[i] = [i];
        for (let j = 1; j <= b.length; j++) {
          if (i === 0) custos[i][j] = j;
          else {
            const sub = a[i - 1] === b[j - 1] ? 0 : 1;
            custos[i][j] = Math.min(
              custos[i - 1][j] + 1,
              custos[i][j - 1] + 1,
              custos[i - 1][j - 1] + sub
            );
          }
        }
      }
      return custos[a.length][b.length];
    }

    function buscar(query) {
      const q = normalizar(query);
      if (!q) return [...todasMusicas].sort((a, b) => a.titulo.localeCompare(b.titulo));

      const comPontuacao = todasMusicas.map(musica => {
        const titulo = normalizar(musica.titulo);
        if (titulo.includes(q)) return { musica, pontuacao: 0 };

        const palavras = titulo.split(/\s+/);
        let melhorDistancia = Infinity;
        palavras.forEach(palavra => {
          const dist = levenshtein(q, palavra);
          if (dist < melhorDistancia) melhorDistancia = dist;
        });

        const tolerancia = Math.max(2, Math.ceil(q.length / 3));
        if (melhorDistancia <= tolerancia) return { musica, pontuacao: 10 + melhorDistancia };
        return null;
      }).filter(Boolean);

      comPontuacao.sort((a, b) => a.pontuacao - b.pontuacao || a.musica.titulo.localeCompare(b.musica.titulo));
      return comPontuacao.map(item => item.musica);
    }

    function renderizar(lista) {
      const container = document.getElementById('lista');
      document.getElementById('contador').textContent = `${lista.length} música(s)`;
      if (lista.length === 0) {
        container.innerHTML = '<p style="color:#888">Nenhuma música encontrada.</p>';
        return;
      }
      container.innerHTML = lista.map(m =>
        `<a href="cifra.html?id=${m.id}">${m.titulo}</a>`
      ).join('');
    }

    function formatarData(iso) {
      const [ano, mes, dia] = iso.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    async function verificarRepertorioDeHoje() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data } = await sbClient
        .from('repertorios')
        .select('id')
        .eq('data_evento', hoje)
        .limit(1);

      if (data && data.length > 0) {
        window.location.href = `repertorio.html?id=${data[0].id}`;
        return true;
      }
      return false;
    }

    async function carregarRepertoriosProximos() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data } = await sbClient
        .from('repertorios')
        .select('id, nome, data_evento')
        .gte('data_evento', hoje)
        .order('data_evento')
        .limit(5);

      const container = document.getElementById('repertorios');
      if (!data || data.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = data.map(r => {
        const dias = Math.ceil((new Date(r.data_evento) - new Date(hoje)) / 86400000);
        return `
          <a class="cardRepertorio" href="repertorio.html?id=${r.id}">
            <div class="nome">${r.nome}</div>
            <div class="dias">${formatarData(r.data_evento)} — faltam ${dias} dia(s)</div>
          </a>
        `;
      }).join('');
    }

    async function carregar() {
      const foiRedirecionado = await verificarRepertorioDeHoje();
      if (foiRedirecionado) return;

      await carregarRepertoriosProximos();

      const { data, error } = await sbClient.from('musicas').select('id, titulo').order('titulo');
      if (error) {
        document.getElementById('lista').textContent = 'Erro ao carregar: ' + error.message;
        return;
      }
      todasMusicas = data;
      renderizar(buscar(''));
    }

    document.getElementById('busca').addEventListener('input', (e) => {
      renderizar(buscar(e.target.value));
    });

    async function iniciar() {
      const sessao = await protegerPagina();
      if (!sessao) return;

      const perfil = await obterPerfil();
      const nome = perfil ? perfil.nome : "";
      const ehAdmin = perfil && perfil.papel === "administrador";

      document.getElementById('boasVindas').innerHTML = `
        <span>Bem-vindo, ${nome}!</span>
        <a href="#" id="btnSair">Sair</a>
      `;
      document.getElementById('btnSair').addEventListener('click', (e) => {
        e.preventDefault();
        fazerLogout();
      });

      if (ehAdmin) {
        document.getElementById('linkNovoRepertorio').style.display = 'inline-block';
        document.getElementById('linkAdmin').style.display = 'inline-block';
      }

      carregar();
    }

    iniciar();
  </script>
</body>
</html>
