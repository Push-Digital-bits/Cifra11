<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G11 Cifras</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#05070F">
  <script src="fundo.js" defer></script>
  <style>
    #topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    #logoTopo {
      width: 61px;
      height: 60px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    #logoTopo img {
      position: absolute;
      width: 68.65px;
      height: 68.65px;
      left: -5.09px;
      top: -2.96px;
      max-width: none;
    }

    #botoesTopo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    #btnAtualizar {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #33426b;
      color: #FDF8F1;
      box-shadow: none;
      line-height: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }
    #btnAtualizar:hover { background: rgba(255, 255, 255, 0.12); filter: none; }
    #btnAtualizar .iconeAtualizar { font-size: 14px; }
    #btnAtualizar .rotuloAtualizar {
      font-size: 6.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #94A3B8;
    }
    #btnAtualizar.girando .iconeAtualizar { animation: girarAtualizar 0.8s linear infinite; }
    @keyframes girarAtualizar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #menuConfig { position: relative; flex-shrink: 0; }
    #btnConfig {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #33426b;
      color: #FDF8F1;
      font-size: 18px;
      box-shadow: none;
      line-height: 1;
    }
    #btnConfig:hover { background: rgba(255, 255, 255, 0.12); filter: none; }

    #dropdownConfig {
      display: none;
      position: absolute;
      right: 0;
      top: 46px;
      min-width: 190px;
      background: #16213A;
      border: 1px solid #2A3A5C;
      border-radius: 12px;
      overflow: hidden;
      z-index: 30;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    #dropdownConfig.aberto { display: block; }
    #dropdownConfig a {
      display: block;
      padding: 12px 16px;
      font-size: 14px;
      color: #E5E7EB;
      text-decoration: none;
      border-bottom: 1px solid #1E293B;
    }
    #dropdownConfig a:last-child { border-bottom: none; }
    #dropdownConfig a:active { background: #0F172A; }

    #saudacaoTopo {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #FDF8F1;
      margin: 10px 0 16px;
    }

    #busca { margin-bottom: 14px; }

    #repertorios {
      margin-bottom: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .cardRepertorio {
      display: block;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      padding: 12px;
      border-left: 4px solid var(--cor-culto, #F97316);
      animation: apareceCard 0.35s ease both;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cardRepertorio::before {
      content: '';
      position: absolute;
      top: -15px;
      right: -15px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--cor-culto, #F97316) 0%, transparent 70%);
      opacity: 0.22;
      pointer-events: none;
    }
    .cardRepertorio:active { transform: scale(0.98); }
    .cardRepertorio .nome {
      font-weight: 700;
      font-size: 14px;
      color: var(--cor-culto, #FDF8F1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cardRepertorio .icone { font-size: 15px; flex-shrink: 0; }
    .cardRepertorio .dias { font-size: 11px; color: #94A3B8; margin-top: 3px; }
    @keyframes apareceCard {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .linksAcao { margin-bottom: 16px; }
    .linksAcao a {
      display: inline-block;
      font-size: 13px;
      margin-right: 16px;
      margin-bottom: 6px;
    }

    #contador { color: #64748B; font-size: 12px; margin-bottom: 6px; }

    #lista a {
      display: block;
      padding: 13px 16px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #E5E7EB;
      font-size: 16px;
      background: rgba(19, 27, 48, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s ease;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #lista a:active { background: rgba(19, 27, 48, 0.6); }

    #lista .linhaSelecao {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      margin-bottom: 8px;
      color: #E5E7EB;
      font-size: 16px;
      background: rgba(19, 27, 48, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
      -webkit-user-select: none;
    }
    #lista .linhaSelecao input[type="checkbox"] { width: 20px; height: 20px; margin: 0; flex-shrink: 0; }
    #lista .linhaSelecao .tituloSelecao { flex: 1; }

    #barraSelecao {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
    }
    #barraSelecao.ativa { display: flex; }
    #barraSelecao label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #E5E7EB;
      cursor: pointer;
    }
    #barraSelecao label input[type="checkbox"] { width: 18px; height: 18px; margin: 0; }
    .acoesSelecao { display: flex; gap: 8px; }
    .acoesSelecao button { margin: 0; width: auto; padding: 8px 14px; font-size: 13px; }
    button.perigo { background: #7F1D1D; color: #FEE2E2; border: 1px solid #991B1B; }
  </style>
</head>
<body>
  <div id="topo">
    <div id="logoTopo"><img src="logo.png" alt="G11 Cifras"></div>
    <div id="botoesTopo">
      <button id="btnAtualizar" type="button" aria-label="Buscar atualizações">
        <span class="iconeAtualizar">🔄</span>
        <span class="rotuloAtualizar">atualizar</span>
      </button>
      <div id="menuConfig">
        <button id="btnConfig" type="button" aria-label="Configurações">⚙️</button>
        <div id="dropdownConfig">
          <a href="#" id="btnSair">Sair</a>
          <a href="importar.html" id="menuImportar" style="display:none;">📥 Importar músicas</a>
          <a href="admin.html" id="menuAdmin" style="display:none;">👤 Gerenciar usuários</a>
        </div>
      </div>
    </div>
  </div>
  <div id="saudacaoTopo"></div>

  <input type="text" id="busca" placeholder="Buscar música...">

  <div id="repertorios"></div>

  <div class="linksAcao">
    <a id="linkNovoRepertorio" href="novo-repertorio.html" style="display:none;">+ Criar novo repertório</a>
    <a id="linkNovaMusica" href="nova-musica.html" style="display:none;">🎵 Adicionar nova música</a>
    <a id="linkYoutube" href="https://www.youtube.com/" target="_blank" rel="noopener" style="display:none;">▶️ Acessar o YouTube</a>
  </div>

  <div id="contador"></div>
  <div id="barraSelecao">
    <label><input type="checkbox" id="checkSelecionarTodas"> Selecionar todas</label>
    <div class="acoesSelecao">
      <button type="button" id="btnApagarSelecionadas" class="perigo">🗑️ Apagar (<span id="contadorSelecionados">0</span>)</button>
      <button type="button" id="btnCancelarSelecao" class="secundario">Cancelar</button>
    </div>
  </div>
  <div id="lista">Carregando...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="offline.js"></script>
  <script>
    let todasMusicas = [];
    let ehAdminGlobal = false;
    let modoSelecao = false;
    let selecionadosParaApagar = new Set();
    let pressTimer = null;
    let pressMoveu = false;

    function normalizar(texto) {
      return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function levenshtein(a, b) {
      const custos = [];
      for (let i = 0; i <= a.length; i++) {
        custos[i] = [i];
        for (let j = 1; j <= b.length; j++) {
          if (i === 0) custos[i][j] = j;
          else {
            const sub = a[i - 1] === b[j - 1] ? 0 : 1;
            custos[i][j] = Math.min(
              custos[i - 1][j] + 1,
              custos[i][j - 1] + 1,
              custos[i - 1][j - 1] + sub
            );
          }
        }
      }
      return custos[a.length][b.length];
    }

    function buscar(query) {
      const q = normalizar(query);
      if (!q) return [...todasMusicas].sort((a, b) => a.titulo.localeCompare(b.titulo));

      const comPontuacao = todasMusicas.map(musica => {
        const titulo = normalizar(musica.titulo);
        if (titulo.includes(q)) return { musica, pontuacao: 0 };

        const palavras = titulo.split(/\s+/);
        let melhorDistancia = Infinity;
        palavras.forEach(palavra => {
          const dist = levenshtein(q, palavra);
          if (dist < melhorDistancia) melhorDistancia = dist;
        });

        const tolerancia = Math.max(2, Math.ceil(q.length / 3));
        if (melhorDistancia <= tolerancia) return { musica, pontuacao: 10 + melhorDistancia };
        return null;
      }).filter(Boolean);

      comPontuacao.sort((a, b) => a.pontuacao - b.pontuacao || a.musica.titulo.localeCompare(b.musica.titulo));
      return comPontuacao.map(item => item.musica);
    }

    function renderizar(lista) {
      const container = document.getElementById('lista');
      document.getElementById('contador').textContent = `${lista.length} música(s)`;
      if (lista.length === 0) {
        container.innerHTML = modoSelecao ? '' : '<p style="color:#64748B">Nenhuma música encontrada.</p>';
        atualizarBarraSelecao(lista);
        return;
      }
      if (modoSelecao) {
        container.innerHTML = lista.map(m => `
          <div class="linhaSelecao" data-id="${m.id}">
            <input type="checkbox" class="checkSelecao" data-id="${m.id}" ${selecionadosParaApagar.has(String(m.id)) ? 'checked' : ''}>
            <span class="tituloSelecao">${m.titulo}</span>
          </div>
        `).join('');
      } else {
        container.innerHTML = lista.map(m =>
          `<a href="cifra.html?id=${m.id}" data-id="${m.id}">${m.titulo}</a>`
        ).join('');
      }
      atualizarBarraSelecao(lista);
    }

    function listaAtualFiltrada() {
      return buscar(document.getElementById('busca').value);
    }

    function ativarModoSelecao(idInicial) {
      if (!ehAdminGlobal || modoSelecao) return;
      modoSelecao = true;
      selecionadosParaApagar = new Set([String(idInicial)]);
      document.getElementById('barraSelecao').classList.add('ativa');
      renderizar(listaAtualFiltrada());
    }

    function sairDoModoSelecao() {
      modoSelecao = false;
      selecionadosParaApagar = new Set();
      document.getElementById('barraSelecao').classList.remove('ativa');
      renderizar(listaAtualFiltrada());
    }

    function alternarSelecaoMusica(id, marcado) {
      if (marcado) selecionadosParaApagar.add(String(id)); else selecionadosParaApagar.delete(String(id));
      atualizarBarraSelecao(listaAtualFiltrada());
    }

    function atualizarBarraSelecao(listaVisivel) {
      document.getElementById('contadorSelecionados').textContent = selecionadosParaApagar.size;
      const lista = listaVisivel || [];
      const todosMarcadosAgora = lista.length > 0 && lista.every(m => selecionadosParaApagar.has(String(m.id)));
      document.getElementById('checkSelecionarTodas').checked = todosMarcadosAgora;
    }

    function iniciarPressTimer(id) {
      pressMoveu = false;
      pressTimer = setTimeout(() => {
        if (!pressMoveu) ativarModoSelecao(id);
      }, 550);
    }

    function cancelarPressTimer() {
      clearTimeout(pressTimer);
      pressTimer = null;
    }

    function formatarData(iso) {
      const [ano, mes, dia] = iso.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    function saudacaoPorHora() {
      const hora = new Date().getHours();
      if (hora < 12) return 'Bom dia';
      if (hora < 18) return 'Boa tarde';
      return 'Boa noite';
    }

    function estiloCulto(nome) {
      const n = normalizar(nome);
      if (n.includes('quinta')) return { cor: '#A78BFA', icone: '🎤' };
      if (n.includes('domingo')) return { cor: '#38BDF8', icone: '⛪' };
      if (n.includes('ensaio')) return { cor: '#34D399', icone: '🎸' };
      return { cor: '#F97316', icone: '🎶' };
    }

    async function verificarRepertorioDeHoje() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data, error } = await sbClient
        .from('repertorios')
        .select('id')
        .eq('data_evento', hoje)
        .limit(1);

      if (error) throw error;

      if (data && data.length > 0) {
        window.location.href = `repertorio.html?id=${data[0].id}`;
        return true;
      }
      return false;
    }

    function renderizarRepertoriosProximos(lista) {
      const container = document.getElementById('repertorios');
      const hoje = new Date().toISOString().split('T')[0];
      if (!lista || lista.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = lista.map((r, indice) => {
        const dias = Math.ceil((new Date(r.data_evento) - new Date(hoje)) / 86400000);
        const { cor, icone } = estiloCulto(r.nome);
        return `
          <a class="cardRepertorio card" href="repertorio.html?id=${r.id}" style="--cor-culto:${cor}; animation-delay:${indice * 0.06}s;">
            <div class="nome"><span class="icone">${icone}</span>${r.nome}</div>
            <div class="dias">${formatarData(r.data_evento)} — faltam ${dias} dia(s)</div>
          </a>
        `;
      }).join('');
    }

    async function carregarRepertoriosProximos() {
      const hoje = new Date().toISOString().split('T')[0];
      const { data, error } = await sbClient
        .from('repertorios')
        .select('id, nome, data_evento')
        .gte('data_evento', hoje)
        .order('data_evento')
        .limit(5);

      if (error) throw error;

      salvarCacheOffline('repertoriosProximos', data || []);
      renderizarRepertoriosProximos(data || []);
    }

    async function carregar() {
      let semInternet = false;

      try {
        const foiRedirecionado = await verificarRepertorioDeHoje();
        if (foiRedirecionado) return;
      } catch (e) {
        semInternet = true;
      }

      try {
        await carregarRepertoriosProximos();
      } catch (e) {
        semInternet = true;
        renderizarRepertoriosProximos(lerCacheOffline('repertoriosProximos'));
      }

      try {
        const { data, error } = await sbClient.from('musicas').select('id, titulo').order('titulo');
        if (error) throw error;
        todasMusicas = data;
        salvarCacheOffline('todasMusicas', data);
      } catch (e) {
        semInternet = true;
        todasMusicas = lerCacheOffline('todasMusicas') || [];
      }

      renderizar(buscar(''));

      if (semInternet) mostrarAvisoOffline();
      else esconderAvisoOffline();
    }

    document.getElementById('busca').addEventListener('input', (e) => {
      renderizar(buscar(e.target.value));
    });

    document.getElementById('btnConfig').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('dropdownConfig').classList.toggle('aberto');
    });
    document.getElementById('dropdownConfig').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => {
      document.getElementById('dropdownConfig').classList.remove('aberto');
    });

    document.getElementById('btnAtualizar').addEventListener('click', async () => {
      const botao = document.getElementById('btnAtualizar');
      if (botao.classList.contains('girando')) return;
      botao.classList.add('girando');
      try {
        if ('caches' in window) {
          const nomes = await caches.keys();
          await Promise.all(nomes.map(nome => caches.delete(nome)));
        }
        if ('serviceWorker' in navigator) {
          const registros = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registros.map(registro => registro.update()));
        }
      } catch (e) {}
      location.reload();
    });

    const listaEl = document.getElementById('lista');

    listaEl.addEventListener('touchstart', (e) => {
      if (!ehAdminGlobal || modoSelecao) return;
      const linha = e.target.closest('[data-id]');
      if (!linha) return;
      iniciarPressTimer(linha.getAttribute('data-id'));
    }, { passive: true });

    listaEl.addEventListener('touchmove', () => {
      pressMoveu = true;
      cancelarPressTimer();
    });

    listaEl.addEventListener('touchend', () => {
      cancelarPressTimer();
    });

    listaEl.addEventListener('contextmenu', (e) => {
      if (!ehAdminGlobal) return;
      const linha = e.target.closest('[data-id]');
      if (!linha) return;
      e.preventDefault();
      if (modoSelecao) return;
      ativarModoSelecao(linha.getAttribute('data-id'));
    });

    listaEl.addEventListener('change', (e) => {
      if (!modoSelecao) return;
      const caixa = e.target.closest('.checkSelecao');
      if (!caixa) return;
      alternarSelecaoMusica(caixa.getAttribute('data-id'), caixa.checked);
    });

    listaEl.addEventListener('click', (e) => {
      if (!modoSelecao) return;
      if (e.target.classList.contains('checkSelecao')) return;
      const linha = e.target.closest('.linhaSelecao');
      if (!linha) return;
      const caixa = linha.querySelector('.checkSelecao');
      caixa.checked = !caixa.checked;
      alternarSelecaoMusica(linha.getAttribute('data-id'), caixa.checked);
    });

    document.getElementById('checkSelecionarTodas').addEventListener('change', (e) => {
      const lista = listaAtualFiltrada();
      if (e.target.checked) lista.forEach(m => selecionadosParaApagar.add(String(m.id)));
      else lista.forEach(m => selecionadosParaApagar.delete(String(m.id)));
      renderizar(lista);
    });

    document.getElementById('btnCancelarSelecao').addEventListener('click', () => {
      sairDoModoSelecao();
    });

    document.getElementById('btnApagarSelecionadas').addEventListener('click', async () => {
      if (selecionadosParaApagar.size === 0) return;
      const ok = confirm(`Apagar ${selecionadosParaApagar.size} música(s)? Essa ação não pode ser desfeita.`);
      if (!ok) return;

      const ids = [...selecionadosParaApagar];
      const { error } = await sbClient.from('musicas').delete().in('id', ids);
      if (error) {
        alert('Erro ao apagar: ' + error.message);
        console.error(error);
        return;
      }

      todasMusicas = todasMusicas.filter(m => !selecionadosParaApagar.has(String(m.id)));
      salvarCacheOffline('todasMusicas', todasMusicas);
      sairDoModoSelecao();
    });

    async function iniciar() {
      const sessao = await protegerPagina();
      if (!sessao) return;

      const perfil = await obterPerfil();
      const nome = perfil ? perfil.nome : "";
      const ehAdmin = perfil && perfil.papel === "administrador";
      ehAdminGlobal = !!ehAdmin;

      document.getElementById('saudacaoTopo').textContent = `${saudacaoPorHora()}, ${nome}!`;

      document.getElementById('btnSair').addEventListener('click', (e) => {
        e.preventDefault();
        fazerLogout();
      });

      if (ehAdmin) {
        document.getElementById('linkNovoRepertorio').style.display = 'inline-block';
        document.getElementById('linkNovaMusica').style.display = 'inline-block';
        document.getElementById('linkYoutube').style.display = 'inline-block';
        document.getElementById('menuImportar').style.display = 'block';
        document.getElementById('menuAdmin').style.display = 'block';
      }

      carregar();
    }

    iniciar();
  </script>
</body>
</html>
