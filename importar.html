<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Cifras - G11 Cifras</title>
<link rel="stylesheet" href="estilo.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#05070F">
<script src="fundo.js" defer></script>
<style>
body { max-width: 800px; }
.linha { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #1E293B; }
.categoria { font-size: 11px; color: #64748B; min-width: 100px; }
.linha input[type="text"] { flex: 1; padding: 8px; margin: 0; }
#lista { max-height: 55vh; overflow-y: auto; margin: 16px 0; background: #16213A; border: 1px solid #2A3A5C; border-radius: 12px; padding: 6px 10px; }
button { padding: 10px 16px; font-size: 14px; margin-right: 10px; margin-top: 0; width: auto; }
button.secundario { background: #16213A; color: #FDF8F1; border: 1px solid #2A3A5C; }
#status { margin: 12px 0; font-weight: 700; color: #F97316; }
#controles { margin-top: 16px; }
#rotuloFiltro { margin-bottom: 6px; }
#filtroCategorias { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
#filtroCategorias label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #16213A; border: 1px solid #2A3A5C; border-radius: 20px; font-size: 12px; color: #E5E7EB; cursor: pointer; }
#filtroCategorias label input { margin: 0; width: auto; }
.botoesMarcar { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="conteudo" style="display:none;">
<h1>Importar arquivo raiz (.db)</h1>
<input type="file" id="arquivoDb" accept=".db">
<div id="status"></div>

<div id="controles" style="display:none;">
<div id="rotuloFiltro" class="categoria">Categorias no arquivo:</div>
<div id="filtroCategorias"></div>
<div class="botoesMarcar">
<button type="button" id="btnMarcarTodos" class="secundario">☑️ Marcar todos</button>
<button type="button" id="btnDesmarcarTodos" class="secundario">⬜ Desmarcar todos</button>
</div>
</div>

<div id="lista"></div>

<button id="btnImportar" style="display:none;">Importar selecionados</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script>
let notasCarregadas = [];
let categoriasDisponiveis = [];
let categoriasAtivas = new Set();
let selecionados = new Set();
let grupoIdAtual = null;

document.getElementById('arquivoDb').addEventListener('change', async (evento) => {
const arquivo = evento.target.files[0];
if (!arquivo) return;

document.getElementById('status').textContent = 'Lendo arquivo...';

const SQL = await initSqlJs({
locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`
});

const buffer = await arquivo.arrayBuffer();
const db = new SQL.Database(new Uint8Array(buffer));

const resultado = db.exec(`
SELECT n.note_id, n.title, n.content, IFNULL(c.category_name, 'Sem categoria') as categoria
FROM note n
LEFT JOIN category c ON n.category = c.category_id
WHERE (n.is_deleted IS NULL OR n.is_deleted NOT IN ('true','1'))
ORDER BY categoria, n.title
`);

db.close();

if (!resultado.length) {
document.getElementById('status').textContent = 'Nenhuma nota encontrada.';
return;
}

notasCarregadas = resultado[0].values.map(linha => ({
id: linha[0],
titulo: (linha[1] || '(sem título)').trim(),
conteudo: linha[2] || '',
categoria: linha[3]
}));

categoriasDisponiveis = [...new Set(notasCarregadas.map(nota => nota.categoria))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
categoriasAtivas = new Set(categoriasDisponiveis);
selecionados = new Set(
notasCarregadas.map((nota, indice) => nota.categoria === 'Cifras' ? indice : null).filter(indice => indice !== null)
);

renderizarFiltroCategorias();
renderizarLista();
document.getElementById('status').textContent = `${notasCarregadas.length} notas encontradas.`;
document.getElementById('controles').style.display = 'block';
document.getElementById('btnImportar').style.display = 'inline-block';
});

function renderizarFiltroCategorias() {
const container = document.getElementById('filtroCategorias');
container.innerHTML = categoriasDisponiveis.map(cat => `
<label><input type="checkbox" data-categoria="${cat.replace(/"/g, '&quot;')}" ${categoriasAtivas.has(cat) ? 'checked' : ''}> ${cat}</label>
`).join('');

container.querySelectorAll('input[type="checkbox"]').forEach(caixa => {
caixa.addEventListener('change', () => {
const cat = caixa.getAttribute('data-categoria');
if (caixa.checked) categoriasAtivas.add(cat); else categoriasAtivas.delete(cat);
renderizarLista();
});
});
}

function renderizarLista() {
const container = document.getElementById('lista');
container.innerHTML = '';

notasCarregadas.forEach((nota, indice) => {
if (!categoriasAtivas.has(nota.categoria)) return;

const linha = document.createElement('div');
linha.className = 'linha';
linha.innerHTML = `
<input type="checkbox" data-indice="${indice}" ${selecionados.has(indice) ? 'checked' : ''}>
<span class="categoria">${nota.categoria}</span>
<input type="text" data-indice="${indice}" value="${nota.titulo.replace(/"/g, '&quot;')}">
`;
container.appendChild(linha);
});

container.querySelectorAll('input[type="checkbox"]').forEach(caixa => {
caixa.addEventListener('change', () => {
const indice = Number(caixa.getAttribute('data-indice'));
if (caixa.checked) selecionados.add(indice); else selecionados.delete(indice);
});
});
}

document.getElementById('btnMarcarTodos').addEventListener('click', () => {
notasCarregadas.forEach((nota, indice) => {
if (categoriasAtivas.has(nota.categoria)) selecionados.add(indice);
});
renderizarLista();
});

document.getElementById('btnDesmarcarTodos').addEventListener('click', () => {
selecionados.clear();
renderizarLista();
});

function normalizarTitulo(titulo) {
return titulo.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
}

document.getElementById('btnImportar').addEventListener('click', async () => {
if (selecionados.size === 0) {
alert('Marque pelo menos uma música.');
return;
}

const titulosEditados = {};
document.querySelectorAll('#lista input[type="text"]').forEach(campo => {
titulosEditados[Number(campo.getAttribute('data-indice'))] = campo.value.trim();
});

const candidatas = [...selecionados].map(indice => ({
titulo: titulosEditados[indice] !== undefined ? titulosEditados[indice] : notasCarregadas[indice].titulo,
conteudo: notasCarregadas[indice].conteudo,
grupo_id: grupoIdAtual
}));

document.getElementById('status').textContent = 'Verificando músicas já existentes...';

const { data: existentesData, error: erroExistentes } = await sbClient.from('musicas').select('titulo');
if (erroExistentes) {
document.getElementById('status').textContent = 'Erro ao verificar duplicadas: ' + erroExistentes.message;
console.error(erroExistentes);
return;
}

const titulosExistentes = new Set((existentesData || []).map(m => normalizarTitulo(m.titulo)));
const titulosDoLote = new Set();
const selecionadas = [];
let duplicadas = 0;

candidatas.forEach(nota => {
const chave = normalizarTitulo(nota.titulo);
if (titulosExistentes.has(chave) || titulosDoLote.has(chave)) {
duplicadas++;
return;
}
titulosDoLote.add(chave);
selecionadas.push(nota);
});

if (selecionadas.length === 0) {
document.getElementById('status').textContent = `Nenhuma música nova pra importar — ${duplicadas} já existiam no banco.`;
return;
}

const sufixoDuplicadas = duplicadas > 0 ? ` (${duplicadas} já existiam e foram ignoradas)` : '';
document.getElementById('status').textContent = `Importando ${selecionadas.length} músicas novas${sufixoDuplicadas}...`;

// Envia em lotes de 50 pra não sobrecarregar
for (let i = 0; i < selecionadas.length; i += 50) {
const lote = selecionadas.slice(i, i + 50);
const { error } = await sbClient.from('musicas').insert(lote);
if (error) {
document.getElementById('status').textContent = 'Erro ao importar: ' + error.message;
console.error(error);
return;
}
}

document.getElementById('status').textContent = `${selecionadas.length} música(s) nova(s) importada(s) com sucesso!${sufixoDuplicadas}`;
});

async function iniciar() {
const sessao = await protegerPagina();
if (!sessao) return;

const perfil = await obterPerfil();

if (!perfil || !perfil.podeEditarConteudo) {
window.location.href = 'index.html';
return;
}

grupoIdAtual = perfil.grupoId;
document.getElementById('conteudo').style.display = 'block';
}

iniciar();
</script>
</body>
</html>
